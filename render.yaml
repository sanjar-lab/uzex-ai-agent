services:
  - type: web
    name: uzex-ai-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.server
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEYS
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: LLM_ORDER
        value: claude,gemini,groq,openrouter
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash,gemini-3-flash-preview,gemini-3.1-flash-lite,gemini-3.5-flash-lite
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_ROUND_ROBIN
        value: "0"
      - key: DUCKDB_MEMORY
        value: 250MB
      - key: WEBHOOK_SECRET
        generateValue: true
